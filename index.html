<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Dickhead's Fantasy Football Form</title>
<link rel="stylesheet" href="league.css">
</head>
<body>
<div id="app"></div>

<!-- Shared core: roster, PIN, backend, survey registry, drag, chrome.
     Edit league.js, not this file, to change any of those. -->
<script src="league.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   SURVEY 1 — PRE-SEASON INTAKE
   ═══════════════════════════════════════════════════════════════════════
   Buy-in, punishment ideas, draft availability, rivalry rankings, prize split.

   The commissioner's results view used to live in this file; it now lives in
   desk.html, and the public read-only summaries live in boards.html. This
   file is just the form.

   All config (roster, weekends, buy-ins, prize defaults) is in league.js.
   ═══════════════════════════════════════════════════════════════════════ */

var SURVEY_ID = 'intake';

let state = {
  view: 'form',
  name: '',
  buyIn: '',
  punishment: '',
  locality: '',
  weekendOrder: WEEKENDS.map(w=>w.id),
  cantMake: {},
  expanded: {},
  inPerson: {},
  beefOrder: [],
  prizeNoPref: false,
  prizePlaces: DEFAULT_PLACES.slice(),
  prizeRegSeason: DEFAULT_REG_SEASON,   // 0 = regular-season leader not paid
  submitting: false,
  error: '',
  alreadySubmitted: null,
  overrideConfirm: false,
  overrideNotice: false,
  statusKnown: false,
  _animateNag: false
};

syncBeefOrder();

/* Drag-to-reorder lives in league.js; it hands the new order back here. */
LEAGUE_HOOKS.dragCommit = function(listKey, ids){
  if(listKey === 'weekend') state.weekendOrder = ids;
  else if(listKey === 'beef') state.beefOrder = ids;
};
LEAGUE_HOOKS.render = function(){ render(); };

function isOpen(){ return LeagueStatus.isOpen(SURVEY_ID); }

function renderHeader(){
  return renderBanner({
    tag: 'DRAFT SEASON \u00b7 2026',
    titleHtml: "The Dickhead's<br>Fantasy Football Form",
    subtitle: 'Fill it out. No exceptions. League business is not optional.',
    nav: standardNav(SURVEY_ID)
  });
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(state.view === 'success'){ app.appendChild(renderSuccess()); return; }
  app.appendChild(renderHeader());

  const main = renderForm();
  if(!isOpen() && state.statusKnown) applyReadOnly(main);
  app.appendChild(main);
}

/* A closed / archived / draft survey still loads and still shows you your own
   saved answers — it just can't be written to. The server enforces this too
   (Code.gs rejects the write), so this is presentation, not the lock itself. */
function applyReadOnly(main){
  const meta = LeagueStatus.meta(SURVEY_ID);
  const st = LeagueStatus.of(SURVEY_ID);
  const card = main.querySelector('.card');
  if(card) card.classList.add('readonly');

  const banner = document.createElement('div');
  banner.className = 'closed-banner' + (st === 'draft' ? ' draft' : '');
  banner.innerHTML = st === 'draft'
    ? '<strong>Not released yet.</strong> The commissioner hasn\'t opened this one to the league. You\'re seeing a preview.'
    : '<strong>' + esc(meta.hubLabel) + '.</strong> This survey is no longer accepting responses. '
      + 'Pick your name to see what you submitted \u2014 the results live on the '
      + '<a href="boards.html">boards</a>.';
  main.insertBefore(banner, main.firstChild);

  const zone = main.querySelector('.submit-zone');
  if(zone) zone.innerHTML = '<p class="readonly-note">Responses are locked. '
    + 'Ask the commissioner to reopen it if you need to change something.</p>';

  const sel = main.querySelector('#nameSelect');
  if(sel) sel.disabled = false;
}

/* When the survey is closed we pull the person's saved row so they can read
   back exactly what they put in. */
async function loadMine(){
  if(!state.name || isOpen()) return;
  const who = state.name;
  try{
    const r = await LeagueStore.get('response:' + who);
    if(state.name !== who || !r || !r.value) return;
    const row = JSON.parse(r.value);
    state.buyIn         = row.buyIn || '';
    state.punishment    = row.punishment || '';
    state.locality      = row.locality || '';
    state.weekendOrder  = row.weekendOrder || WEEKENDS.map(w=>w.id);
    state.cantMake      = row.cantMake || {};
    state.inPerson      = row.inPerson || {};
    state.beefOrder     = row.beefOrder || [];
    syncBeefOrder();
    state.prizeNoPref   = !row.prizePlan;
    if(row.prizePlan && Array.isArray(row.prizePlan.places)){
      state.prizePlaces    = row.prizePlan.places.slice();
      state.prizeRegSeason = row.prizePlan.regSeason || 0;
    }
    render();
  }catch(e){ /* nothing saved for them, or offline — leave the form blank */ }
}

/* Name changes route to whichever check matters for the current state. */
function onNameChanged(){
  if(isOpen()) checkAlreadySubmitted();
  else loadMine();
}

(async function boot(){
  render();                                    // instant, exactly like before
  try{
    LeagueStatus.hydrate(await LeagueStore.status());
  }catch(e){ /* offline: fall back to the registry default, i.e. open */ }
  state.statusKnown = true;
  if(!isOpen()) render();                      // only re-render if it changed
})();

function syncBeefOrder(){
  const remaining = ROSTER.filter(n => n !== state.name);
  if(!state.beefOrder.length){
    state.beefOrder = remaining.slice();
  } else {
    const kept = state.beefOrder.filter(n => remaining.includes(n));
    const missing = remaining.filter(n => !kept.includes(n));
    state.beefOrder = kept.concat(missing);
  }
}
syncBeefOrder();

function renderForm(){
  const wrap = document.createElement('main');
  wrap.innerHTML = `
    <div class="card">

      <div class="section">
        <div class="down-tag">STARTING LINEUP</div>
        <p class="q-text">Who's filling this out?</p>
        <select id="nameSelect">
          <option value="">Select your name…</option>
          ${ROSTER.map(n=>`<option value="${n}" ${state.name===n?'selected':''}>${n}</option>`).join('')}
        </select>
        ${state.name ? `<p class="name-nag${state._animateNag ? ' animate' : ''}"><span>I know you think you're <em>SO FUNNY</em> putting someone else's name, but please — I need your actual name for this (love you ❤️)</span><span class="nag-second">If this is your actual name, I love you 3000!</span></p>` : ''}
        ${state.name && state.alreadySubmitted ? `<p class="dupe-note">This name already has a locked-in response. Submitting again will <strong>overwrite</strong> the previous one.</p>` : ''}
      </div>

      <div class="section">
        <div class="down-tag">1ST DOWN</div>
        <p class="q-text">How much should the buy-in be?</p>
        <div class="chip-row">
          ${BUYINS.map(b=>`<div class="chip ${state.buyIn===b?'selected':''}" onclick="setBuyIn('${b}')">${b}</div>`).join('')}
        </div>
      </div>

      <div class="section">
        <div class="down-tag">2ND DOWN</div>
        <p class="q-text">Write down at least one possible last-place punishment</p>
        <p class="q-help">We'll vote on the winner later. Please be creative and diabolical.</p>
        <textarea id="punishmentInput" placeholder="e.g. loser has to send a dick pic to their mother">${state.punishment}</textarea>
      </div>

      <div class="section">
        <div class="down-tag">3RD DOWN</div>
        <p class="q-text">When are you available for the draft?</p>
        <p class="q-help">First, tell us where you're coming from — in town (Dallas) or out of town.</p>

        <div class="toggle-row">
          <div class="chip-sm ${state.locality==='local'?'selected':''}" onclick="setLocality('local')">📍 In town (Dallas)</div>
          <div class="chip-sm ${state.locality==='oot'?'selected':''}" onclick="setLocality('oot')">✈️ Out of town</div>
        </div>

        ${state.locality ? `
          <p class="q-help">Now drag the weekends by the ⠿ handle to rank them (top = your first choice). Can't do a whole weekend, or just certain days of it? Hit <strong>"Can't make it?"</strong> on that weekend to pick the exact dates you're out.${state.locality==='oot' ? " It'd be pretty cool if you came down for a weekend — for each one you can do, mark whether you'd be there in person or joining virtually." : ''}</p>
          ${renderWeekendRows()}
        ` : ''}
      </div>

      <div class="section">
        <div class="down-tag">4TH DOWN</div>
        <p class="q-text">Rivalry Selection</p>
        <p class="q-help">This is for <strong>rivalry week</strong> (the last week of the season) — there may even be a mini group punishment or payout for the losing side of each rivalry. Who do you have the most beef with, or want to beat the most? Drag by the ⠿ handle to rank.</p>
        ${renderBeefRows()}
      </div>

      <div class="section">
        <div class="down-tag">OVERTIME · OPTIONAL</div>
        <p class="q-text">How should the prize pool be split?</p>
        <p class="q-help">Set how many places get paid and dial in each cut (5% steps) — you can also give the regular-season points leader a slice. ${state.buyIn
          ? `Live dollars use your <strong>${state.buyIn}</strong> buy-in — a <strong>${money(potTotal(state.buyIn))}</strong> pot.`
          : `Pick a buy-in up in the 1st down to see live dollar amounts.`}</p>
        <label class="nopref-check"><input type="checkbox" ${state.prizeNoPref?'checked':''} onclick="setNoPref(this.checked)"> No preference — let the commissioner decide</label>
        ${state.prizeNoPref ? '' : renderPrizeBuilder()}
      </div>

      <div class="section submit-zone">
        ${state.error ? `<div class="error-msg">${state.error}</div>` : ''}
        ${state.overrideNotice ? `<div class="override-note">You already have a response saved under <strong>${state.name}</strong>. Locking in now will overwrite it — tap again to confirm.</div>` : ''}
        <button class="lock-btn ${state.overrideNotice?'override':''}" ${(state.submitting || !formValid())?'disabled':''} onclick="submitForm()">${state.submitting ? 'Locking it in…' : (state.overrideNotice ? 'Overwrite my previous answer' : 'Lock It In 🔒')}</button>
        <p class="submit-hint" style="${(formValid()||state.submitting)?'display:none':''}">${formValid()?'':formIssue()+' to lock in'}</p>
      </div>

    </div>
  `;
  state._animateNag = false; // consume the one-shot animation flag
  setTimeout(()=>{
    const sel = document.getElementById('nameSelect');
    if(sel) sel.onchange = (e)=>{
      state.name = e.target.value;
      state._animateNag = !!e.target.value;
      state.overrideConfirm = false;
      state.overrideNotice = false;
      state.alreadySubmitted = null;
      syncBeefOrder();
      render();
      onNameChanged();
    };
    const pun = document.getElementById('punishmentInput');
    if(pun) pun.oninput = (e)=>{ state.punishment = e.target.value; refreshSubmitState(); };
  },0);
  return wrap;
}

function renderWeekendRows(){
  return state.weekendOrder.map((id, idx)=>{
    const wk = WEEKENDS.find(w=>w.id===id);
    const inPerson = state.inPerson[id] !== false;
    const cantDays = wk.days.filter(d=>state.cantMake[d.id]);
    const allOut = cantDays.length === wk.days.length;
    const anyCant = cantDays.length > 0;
    const expanded = !!state.expanded[id];

    let summary;
    if(cantDays.length === 0) summary = 'All dates open';
    else if(allOut) summary = "Can't make this weekend";
    else summary = 'Out: ' + cantDays.map(d=>d.short.split(' ')[0]).join(', ');

    const btnLabel = expanded ? 'Done ✓' : (anyCant ? '📅 Edit dates' : "📅 Can't make it?");

    return `
      <div class="wk-row drag-row ${allOut?'unavail':''}" data-id="${id}">
        <div class="wk-top">
          <div class="drag-handle" onpointerdown="startDrag(event,'weekend')">⠿</div>
          <div class="rank-badge">${allOut ? '0' : idx+1}</div>
          <div class="wk-label">
            <span class="name">${wk.label}</span>
            <span class="sub">${summary}</span>
          </div>
          <button class="unavail-btn ${anyCant?'active':''}" onclick="toggleExpand('${id}')">${btnLabel}</button>
        </div>

        ${state.locality==='oot' && !allOut ? `
          <div class="oot-controls">
            <span class="oot-lbl">If you come:</span>
            <span class="chip-sm ${inPerson?'selected':''}" onclick="setInPerson('${id}', true)">In person</span>
            <span class="chip-sm ${!inPerson?'selected virtual':''}" onclick="setInPerson('${id}', false)">Virtual</span>
          </div>` : ''}

        ${expanded ? `
          <div class="day-picker">
            <span class="day-picker-label">Tap the dates you <strong>can't</strong> make:</span>
            <div class="day-chips">
              ${wk.days.map(d=>`<span class="day-chip ${state.cantMake[d.id]?'cant':''}" onclick="toggleDay('${d.id}')">${d.short}</span>`).join('')}
            </div>
            <span class="whole-wk" onclick="toggleWholeWeekend('${id}')">${allOut ? '↺ Actually I can make some' : "✕ Can't make any of this weekend"}</span>
          </div>` : ''}
      </div>
    `;
  }).join('');
}

function renderBeefRows(){
  const n = state.beefOrder.length;
  return state.beefOrder.map((name, idx)=>{
    const heat = n>1 ? 1 - idx/(n-1) : 1; // top row = hottest (most beef)
    const hue = 210 - heat*210; // 0 (hot red) at top -> 210 (cool blue) at bottom
    const bg = `hsl(${hue}, 60%, ${45 - heat*8}%)`;
    const flameCount = Math.max(1, Math.round(heat*5));
    return `
      <div class="beef-row drag-row" data-id="${name}" style="background:${bg}">
        <div class="drag-handle" onpointerdown="startDrag(event,'beef')">⠿</div>
        <div class="lb-rank" style="color:rgba(255,255,255,0.85)">${idx+1}</div>
        <div class="name">${name}</div>
        <div class="flame">${'🔥'.repeat(flameCount)}</div>
      </div>
    `;
  }).join('');
}

function setBuyIn(b){ state.buyIn=b; render(); }

function setLocality(l){ state.locality=l; render(); }

function setInPerson(id, val){ state.inPerson[id]=val; render(); }

function toggleExpand(id){ state.expanded[id] = !state.expanded[id]; render(); }

function toggleDay(dayId){
  if(state.cantMake[dayId]) delete state.cantMake[dayId];
  else state.cantMake[dayId] = true;
  render();
}

function toggleWholeWeekend(id){
  const wk = WEEKENDS.find(w=>w.id===id);
  const allOut = wk.days.every(d=>state.cantMake[d.id]);
  wk.days.forEach(d=>{
    if(allOut) delete state.cantMake[d.id];
    else state.cantMake[d.id] = true;
  });
  render();
}

function prizeTotal(){ return state.prizePlaces.reduce((a,b)=>a+b,0) + state.prizeRegSeason; }

function prizeRemaining(){ return 100 - prizeTotal(); }

function setNoPref(on){ state.prizeNoPref = !!on; render(); }

function resetPrize(){
  state.prizePlaces = DEFAULT_PLACES.slice();
  state.prizeRegSeason = DEFAULT_REG_SEASON;
  render();
}


function setPlaceCount(n){
  n = Math.max(1, Math.min(MAX_PLACES, n));
  const t = (PLACE_TEMPLATES[n] || PLACE_TEMPLATES[3]).slice();
  state.prizePlaces = t;
  if(state.prizeRegSeason > 0) makeRoom(state.prizeRegSeason);
  render();
}


function makeRoom(amount){
  let need = amount;
  while(need > 0){
    let bi = -1, bv = PRIZE_STEP;
    state.prizePlaces.forEach((v,i)=>{ if(v > bv){ bv = v; bi = i; } });
    if(bi === -1) break;               // nothing left to take
    state.prizePlaces[bi] -= PRIZE_STEP;
    need -= PRIZE_STEP;
  }
}


function bumpPlace(i, delta){
  if(delta > 0) delta = Math.min(delta, prizeRemaining());
  const next = state.prizePlaces[i] + delta;
  if(next < PRIZE_STEP) return;         // remove places via the count stepper
  state.prizePlaces[i] = next;
  render();
}


function toggleRegSeason(){
  if(state.prizeRegSeason > 0){
    state.prizePlaces[0] += state.prizeRegSeason; // hand the % back to 1st place
    state.prizeRegSeason = 0;
  } else {
    const before = state.prizePlaces.reduce((a,b)=>a+b,0);
    makeRoom(REG_SEASON_DEFAULT);
    state.prizeRegSeason = before - state.prizePlaces.reduce((a,b)=>a+b,0);
  }
  render();
}

function bumpRegSeason(delta){
  if(delta > 0) delta = Math.min(delta, prizeRemaining());
  const next = state.prizeRegSeason + delta;
  if(next < PRIZE_STEP) return;         // turn it off via the toggle
  state.prizeRegSeason = next;
  render();
}


function prizeDollars(){
  const pot = potTotal(state.buyIn);
  if(!pot) return null;
  return {
    places: state.prizePlaces.map(p => Math.round(pot * p / 100)),
    reg: state.prizeRegSeason > 0 ? Math.round(pot * state.prizeRegSeason / 100) : 0
  };
}

function renderPrizeBuilder(){
  const pot = potTotal(state.buyIn);
  const dols = prizeDollars();
  const rem = prizeRemaining();
  const n = state.prizePlaces.length;

  const placeRows = state.prizePlaces.map((pct,i)=>`
    <div class="prize-row">
      <span class="prize-pos">${ordinal(i+1)}</span>
      <div class="stepper sm">
        <button type="button" class="step" onclick="bumpPlace(${i},-${PRIZE_STEP})" ${pct<=PRIZE_STEP?'disabled':''}>−</button>
        <span class="prize-pct">${pct}%</span>
        <button type="button" class="step" onclick="bumpPlace(${i},${PRIZE_STEP})" ${rem<=0?'disabled':''}>+</button>
      </div>
      ${dols ? `<span class="prize-money">${money(dols.places[i])}</span>` : ''}
    </div>`).join('');

  const regRow = state.prizeRegSeason > 0 ? `
    <div class="prize-row reg">
      <span class="prize-pos">🏆 Reg. season<br><small>points leader</small></span>
      <div class="stepper sm">
        <button type="button" class="step" onclick="bumpRegSeason(-${PRIZE_STEP})" ${state.prizeRegSeason<=PRIZE_STEP?'disabled':''}>−</button>
        <span class="prize-pct">${state.prizeRegSeason}%</span>
        <button type="button" class="step" onclick="bumpRegSeason(${PRIZE_STEP})" ${rem<=0?'disabled':''}>+</button>
      </div>
      ${dols ? `<span class="prize-money">${money(dols.reg)}</span>` : ''}
    </div>` : '';

  const meterClass = rem === 0 ? 'ok' : 'warn';
  const meterText = rem === 0
    ? 'Allocated: 100% ✓'
    : (rem > 0 ? `${100-rem}% allocated · <strong>${rem}% left to assign</strong>` : `<strong>${-rem}% over</strong> — trim a cut`);

  return `
    <div class="prize-builder">
      <div class="places-count">
        <span class="pc-label">Places paid out</span>
        <div class="stepper">
          <button type="button" class="step" onclick="setPlaceCount(${n-1})" ${n<=1?'disabled':''}>−</button>
          <span class="count">${n}</span>
          <button type="button" class="step" onclick="setPlaceCount(${n+1})" ${n>=MAX_PLACES?'disabled':''}>+</button>
        </div>
      </div>

      <div class="prize-rows">
        ${placeRows}
        ${regRow}
      </div>

      <button type="button" class="reg-toggle ${state.prizeRegSeason>0?'on':''}" onclick="toggleRegSeason()" role="switch" aria-checked="${state.prizeRegSeason>0}">
        <span class="reg-toggle-txt">
          <span class="reg-toggle-title">🏆 Pay the regular-season points leader</span>
          <span class="reg-toggle-sub">${state.prizeRegSeason>0 ? `On — carves ${state.prizeRegSeason}% out of the pot. Tap to turn off.` : 'Off — tap to give the #1 seed a cut.'}</span>
        </span>
        <span class="reg-switch" aria-hidden="true"><span class="reg-knob"></span></span>
      </button>

      <div class="prize-total ${meterClass}">
        <span>${meterText}</span>
        <button type="button" class="prize-reset" onclick="resetPrize()">Reset</button>
      </div>
    </div>`;
}

async function checkAlreadySubmitted(){
  if(!state.name){ state.alreadySubmitted = null; return; }
  const who = state.name;
  try{
    const r = await LeagueStore.get('response:' + who);
    if(state.name !== who) return; // name changed while awaiting
    state.alreadySubmitted = !!(r && r.value);
  }catch(e){
    if(state.name === who) state.alreadySubmitted = false;
  }
  render();
}


function formIssue(){
  if(!state.name) return 'Pick your name';
  if(!state.buyIn) return 'Vote on a buy-in';
  if(!state.punishment || !state.punishment.trim()) return 'Add a punishment idea';
  if(!state.locality) return "Tell us where you're coming from";
  const totalDays = WEEKENDS.reduce((a,w)=>a+w.days.length,0);
  if(Object.keys(state.cantMake).length >= totalDays) return 'Leave at least one draft date open';
  if(!state.prizeNoPref && prizeTotal() !== 100) return `Prize split must total 100% (it's at ${prizeTotal()}%)`;
  return '';
}

function formValid(){ return formIssue() === ''; }


function refreshSubmitState(){
  const btn = document.querySelector('.lock-btn');
  if(btn) btn.disabled = state.submitting || !formValid();
  const hint = document.querySelector('.submit-hint');
  if(hint){
    const show = !formValid() && !state.submitting;
    hint.textContent = show ? formIssue() + ' to lock in' : '';
    hint.style.display = show ? '' : 'none';
  }
}

async function submitForm(){
  state.error = '';
  if(!formValid()) return;              // button is disabled anyway; belt-and-suspenders
  if(!state.name){ state.error = 'Pick your name first.'; render(); return; }
  if(!state.buyIn){ state.error = 'Vote on a buy-in amount.'; render(); return; }
  if(!state.punishment || !state.punishment.trim()){ state.error = 'Give us at least one punishment idea.'; render(); return; }
  if(!state.locality){ state.error = "Tell us if you're local or out of town."; render(); return; }
  const totalDays = WEEKENDS.reduce((a,w)=>a+w.days.length,0);
  const cantCount = Object.keys(state.cantMake).length;
  if(cantCount >= totalDays){ state.error = 'You marked every single date as unavailable — leave at least one open.'; render(); return; }
  if(!state.prizeNoPref && prizeTotal() !== 100){
    state.error = `Your prize split adds up to ${prizeTotal()}% — make it 100% (or hit Reset / pick "no preference").`;
    render(); return;
  }

  // One entry per person: if a response already exists, make them confirm the overwrite.
  if(!state.overrideConfirm){
    state.submitting = true; render();
    let exists = false;
    try{
      const r = await LeagueStore.get('response:' + state.name);
      exists = !!(r && r.value);
    }catch(e){ exists = false; }
    state.submitting = false;
    if(exists){
      state.overrideConfirm = true;
      state.overrideNotice = true;
      state.alreadySubmitted = true;
      render();
      return;
    }
  }

  state.overrideNotice = false;
  state.submitting = true; render();

  const payload = {
    name: state.name,
    buyIn: state.buyIn,
    punishment: state.punishment.trim(),
    locality: state.locality,
    weekendOrder: state.weekendOrder,
    cantMake: state.cantMake,
    inPerson: state.inPerson,
    beefOrder: state.beefOrder,
    prizePlan: state.prizeNoPref ? null : { places: state.prizePlaces.slice(), regSeason: state.prizeRegSeason },
    submittedAt: new Date().toISOString()
  };

  try{
    await LeagueStore.set('response:' + state.name, JSON.stringify(payload));
    state.submitting = false;
    state.view = 'success';
    render();
  }catch(e){
    state.submitting = false;
    // Code.gs rejects writes to a survey that isn't open. That can happen
    // mid-session if the commissioner closes it while someone has the page
    // open, so say what actually happened rather than "try again".
    if(e && e.code === 'survey_closed'){
      LeagueStatus.map[SURVEY_ID] = { status: e.status || 'closed' };
      state.error = 'The commissioner closed this survey — responses are locked now.';
    } else {
      state.error = 'Something went wrong saving your response — try again.';
    }
    render();
  }
}

function renderSuccess(){
  const wrap = document.createElement('main');
  wrap.innerHTML = `
    <div class="card success-card">
      <div class="stamp-big">OFFICIALLY<br>ENTERED</div>
      <h2>You're locked in, ${state.name.split(' ')[0]}.</h2>
      <p>Your answers are on record. The commissioner sees all.</p>
      <button class="edit-btn" onclick="backToForm()">Make changes</button>
    </div>
  `;
  return wrap;
}

function backToForm(){ state.view='form'; render(); }
</script>
</body>
</html>
