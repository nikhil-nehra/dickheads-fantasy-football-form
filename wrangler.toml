# ═══════════════════════════════════════════════════════════════════════════
#  THE DICKHEAD'S LEAGUE — app worker
# ═══════════════════════════════════════════════════════════════════════════
#  Site AND API on one origin. That is what makes the write protection in
#  src/hooks.server.ts possible at all: same-origin means Origin checks and
#  SameSite cookies actually mean something.
#
#  The scheduled Sleeper sync is a SEPARATE worker (workers/sleeper-sync/)
#  bound to this same D1 database, because the SvelteKit adapter only emits a
#  `fetch` handler and cannot host a `scheduled` one.
# ═══════════════════════════════════════════════════════════════════════════

name = "dickheads-league"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-08-14"
compatibility_flags = ["nodejs_als"]

# ── Custom domain ───────────────────────────────────────────────────────────
# Must stay ABOVE the first [table] header: TOML would otherwise read this as
# a field of that table, and wrangler warns "Unexpected fields found in assets
# field: routes" and silently deploys without it.
#
# `custom_domain = true` makes wrangler create the DNS record and manage the
# certificate on deploy, so this is the whole configuration — nothing to click.
# The zone must already be in the same Cloudflare account.
#
# Nothing in the app hardcodes an origin (og:image is built from the request
# URL), so the site serves correctly here and on workers.dev.
routes = [
  { pattern = "thedickheadsfootballleague.com", custom_domain = true },
  { pattern = "www.thedickheadsfootballleague.com", custom_domain = true }
]

# Declaring `routes` turns the workers.dev URL OFF by default, which takes the
# site down for the minutes a new domain spends provisioning its certificate.
# Kept on as a fallback. Set to false once the domain has been stable a while
# and you want a single canonical address.
workers_dev = true

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[observability]
enabled = true

# ── Database ────────────────────────────────────────────────────────────────
# Create with:  wrangler d1 create dickheads-league
# then paste the returned id below (it is not a secret).
[[d1_databases]]
binding = "DB"
database_name = "dickheads-league"
database_id = "370ea429-8f05-451e-860a-66a9843d1751"
migrations_dir = "db/migrations"

# ── Public config ───────────────────────────────────────────────────────────
[vars]
SEASON = "2026"
# Your Sleeper league id for the season above. Read-only, not a secret.
SLEEPER_LEAGUE_ID = "1381366017682313216"

# ── Secrets (NEVER in this file) ────────────────────────────────────────────
# wrangler secret put COMMISH_PIN
#
# The old PIN 7531 is burned — it is in the public repo, in the README, and
# permanent in git history. Use a new value here. It never reaches the browser.
