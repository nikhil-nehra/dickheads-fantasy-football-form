<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- The banner is navy now, and this is the colour the browser paints
		     around it, so it has to match the chrome rather than the field. -->
		<meta name="theme-color" content="#173456" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0E2340" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<noscript>
			<div class="noscript-note">
				This page needs JavaScript for ranking and negotiating. Everything else —
				the boards, the results, your saved answers — works without it.
			</div>
		</noscript>
	</body>
</html>
