name: CI

on:
  push:
    branches: [main]
  pull_request:

# The old repo had no CI at all: the Playwright suites in tests/ were run by
# hand, if at all, and Code.gs was copy-pasted into the Apps Script editor.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Verify migrations apply to a clean database
        run: npx wrangler d1 migrations apply dickheads-league --local
        env:
          CI: true

  deploy:
    name: Deploy
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # This used to skip the deploy steps when the secrets were missing, so
      # that CI stayed useful before deployment was wired up. That bootstrap is
      # over, and the skip was actively harmful: a job whose every step is
      # skipped still reports success, so two pushes went green while the live
      # site sat on an older build. Fail instead — a green Deploy job has to
      # mean the site actually moved.
      #
      # The secrets go through `env` rather than being interpolated into the
      # script: `${{ }}` pastes the value into the shell source itself, where a
      # token containing quotes or backticks would be parsed rather than read.
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          status=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name. Add it under" \
                   "Settings -> Secrets and variables -> Actions. Until both" \
                   "secrets exist, nothing pushed to main reaches production."
              status=1
            fi
          done
          exit $status

      - name: Apply migrations
        run: npx wrangler d1 migrations apply dickheads-league --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: true

      - name: Deploy the app
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the Sleeper sync worker
        run: npm run deploy:sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
